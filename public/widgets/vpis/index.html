<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPIS Content Scorer</title>
<script src="https://cdn.jsdelivr.net/npm/postmate@1.5.2/build/postmate.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #161b22;
    color: #e6edf3;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 16px;
    min-height: 100vh;
  }
  .card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
  }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  textarea {
    width: 100%;
    min-height: 120px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 14px;
    padding: 12px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #6EE05A; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #6EE05A;
    color: #0d1117;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .score-section { display: none; }
  .score-section.visible { display: block; }

  .score-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .score-ring {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring circle {
    fill: none;
    stroke-width: 5;
  }
  .score-ring .bg { stroke: #30363d; }
  .score-ring .fg { transition: stroke-dashoffset 0.6s ease, stroke 0.3s; stroke-linecap: round; }
  .score-value {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-size: 18px;
    font-weight: 700;
  }
  .score-meta { flex: 1; }
  .score-meta .label { font-size: 12px; color: #8b949e; margin-bottom: 4px; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-hot { background: rgba(110,224,90,0.15); color: #6EE05A; }
  .badge-great { background: rgba(110,224,90,0.1); color: #6EE05A; }
  .badge-good { background: rgba(227,179,65,0.15); color: #e3b341; }
  .badge-needs-work { background: rgba(248,81,73,0.15); color: #f85149; }

  .factors-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .factor {
    background: #161b22;
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .factor-name { font-size: 13px; color: #8b949e; }
  .factor-score { font-family: monospace; font-size: 14px; font-weight: 600; }

  .suggestions {
    margin-top: 12px;
    padding: 12px;
    background: rgba(248,81,73,0.05);
    border: 1px solid rgba(248,81,73,0.2);
    border-radius: 8px;
    font-size: 13px;
    color: #8b949e;
    line-height: 1.5;
    display: none;
  }
  .suggestions.visible { display: block; }
  .suggestions strong { color: #f85149; }

  .footer {
    text-align: center;
    padding: 16px 0 4px;
    font-size: 11px;
    color: #8b949e;
  }
  .footer a { color: #6EE05A; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h2>VPIS Content Scorer</h2>
    <textarea id="content" placeholder="Paste your content here to score it..."></textarea>
    <button class="btn" id="scoreBtn" onclick="scoreContent()">Score Content</button>
  </div>

  <div class="card score-section" id="results">
    <div class="score-header">
      <div class="score-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="bg" cx="32" cy="32" r="28" />
          <circle class="fg" id="ringFg" cx="32" cy="32" r="28"
            stroke-dasharray="175.93"
            stroke-dashoffset="175.93" />
        </svg>
        <div class="score-value" id="scoreValue">0</div>
      </div>
      <div class="score-meta">
        <div class="label">Overall VPIS Score</div>
        <span class="badge" id="scoreBadge">--</span>
      </div>
    </div>

    <div class="factors-grid" id="factorsGrid"></div>

    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="footer">Powered by <a href="https://0ncore.com" target="_blank">0n Core</a></div>

<script>
  let parentRef = null;

  const handshake = new Postmate.Model({
    getScore: () => lastScore
  });

  handshake.then(parent => {
    parentRef = parent;
    parent.on('elementStore', (data) => {
      if (data && data.text) {
        document.getElementById('content').value = data.text;
        scoreContent();
      }
    });
  });

  let lastScore = null;

  function scoreHook(text) {
    const lines = text.trim().split('\n');
    const first = (lines[0] || '').trim();
    if (!first) return 0;
    let s = 50;
    const weakOpeners = ['i think', 'i believe', 'in my opinion', 'just wanted to', 'so basically', 'hey guys'];
    const lower = first.toLowerCase();
    if (weakOpeners.some(w => lower.startsWith(w))) s -= 25;
    if (first.length > 10 && first.length < 100) s += 15;
    if (/\d/.test(first)) s += 10;
    if (/[!?]$/.test(first)) s += 5;
    if (/^(stop|here'?s|the truth|most people|nobody|everyone|if you|you don'?t|i spent|i lost|i made)/i.test(first)) s += 20;
    return Math.max(0, Math.min(100, s));
  }

  function scoreEmotion(text) {
    const lower = text.toLowerCase();
    let s = 30;
    const fomo = ['don\'t miss', 'before it\'s too late', 'limited', 'exclusive', 'only few', 'last chance', 'running out'];
    const financial = ['revenue', 'profit', 'income', 'savings', '$', 'cost', 'roi', 'money', 'invest'];
    const identity = ['leader', 'expert', 'founder', 'ceo', 'ambitious', 'top performer', 'elite', 'serious'];
    fomo.forEach(f => { if (lower.includes(f)) s += 10; });
    financial.forEach(f => { if (lower.includes(f)) s += 8; });
    identity.forEach(f => { if (lower.includes(f)) s += 7; });
    return Math.max(0, Math.min(100, s));
  }

  function scorePlatform(text) {
    let s = 80;
    const hashtagCount = (text.match(/#\w+/g) || []).length;
    const linkCount = (text.match(/https?:\/\//g) || []).length;
    if (hashtagCount > 3) s -= 15;
    if (hashtagCount > 6) s -= 15;
    if (linkCount > 1) s -= 20;
    if (text.length > 3000) s -= 10;
    if (text.length < 50) s -= 20;
    return Math.max(0, Math.min(100, s));
  }

  function scoreViral(text) {
    let s = 30;
    const lines = text.split('\n').filter(l => l.trim());
    const quotable = lines.filter(l => l.trim().length > 20 && l.trim().length < 120 && /[.!?]$/.test(l.trim()));
    s += Math.min(quotable.length * 10, 30);
    const frameworks = ['step 1', 'step 2', 'first,', 'second,', 'third,', 'here\'s how', 'framework', 'playbook', 'system'];
    frameworks.forEach(f => { if (text.toLowerCase().includes(f)) s += 5; });
    return Math.max(0, Math.min(100, s));
  }

  function scoreSpecificity(text) {
    let s = 20;
    if (/\$[\d,]+/.test(text)) s += 20;
    if (/\d+%/.test(text)) s += 15;
    if (/\d+x/.test(text)) s += 10;
    const tools = ['slack', 'notion', 'stripe', 'zapier', 'hubspot', 'salesforce', 'shopify', 'figma', 'linear', 'github'];
    tools.forEach(t => { if (text.toLowerCase().includes(t)) s += 5; });
    if (/\d{1,2}\s*(days?|weeks?|months?|hours?|minutes?)/.test(text)) s += 10;
    return Math.max(0, Math.min(100, s));
  }

  function scoreStructure(text) {
    let s = 50;
    const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim());
    if (paragraphs.length >= 3 && paragraphs.length <= 8) s += 20;
    const sentences = text.split(/[.!?]+/).filter(s => s.trim());
    const avgLen = sentences.reduce((a, s) => a + s.trim().split(/\s+/).length, 0) / Math.max(sentences.length, 1);
    if (avgLen > 5 && avgLen < 20) s += 15;
    if (avgLen > 25) s -= 15;
    const corporate = ['synergy', 'leverage', 'paradigm', 'holistic', 'ideate', 'circle back', 'touch base', 'low-hanging fruit'];
    corporate.forEach(c => { if (text.toLowerCase().includes(c)) s -= 10; });
    return Math.max(0, Math.min(100, s));
  }

  function scoreKeywords(text) {
    let s = 20;
    const keywords = ['ai', 'automation', 'saas', 'b2b', 'startup', 'scale', 'growth', 'pipeline', 'workflow',
      'integration', 'api', 'no-code', 'low-code', 'crm', 'analytics', 'conversion', 'funnel',
      'outbound', 'inbound', 'lead gen', 'cold email', 'linkedin', 'seo', 'content'];
    const lower = text.toLowerCase();
    keywords.forEach(k => { if (lower.includes(k)) s += 4; });
    return Math.max(0, Math.min(100, s));
  }

  function scoreCTA(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    const last3 = lines.slice(-3).join(' ').toLowerCase();
    let s = 20;
    if (/\?/.test(last3)) s += 30;
    const ctaPhrases = ['what do you think', 'agree?', 'thoughts?', 'comment below', 'let me know',
      'who else', 'drop a', 'share your', 'repost', 'save this', 'follow for', 'dm me'];
    ctaPhrases.forEach(c => { if (last3.includes(c)) s += 10; });
    if (/^(p\.?s\.?|bonus|pro tip)/im.test(last3)) s += 10;
    return Math.max(0, Math.min(100, s));
  }

  function getScoreColor(score) {
    if (score >= 80) return '#6EE05A';
    if (score >= 60) return '#e3b341';
    return '#f85149';
  }

  function getBadge(score) {
    if (score >= 90) return { text: 'HOT', cls: 'badge-hot' };
    if (score >= 80) return { text: 'GREAT', cls: 'badge-great' };
    if (score >= 60) return { text: 'GOOD', cls: 'badge-good' };
    return { text: 'NEEDS WORK', cls: 'badge-needs-work' };
  }

  function getSuggestions(factors) {
    const tips = [];
    if (factors.Hook < 60) tips.push('Open with a bold declaration, a number, or a provocative question.');
    if (factors.Emotion < 50) tips.push('Add FOMO triggers, financial specifics, or identity language.');
    if (factors.Platform < 60) tips.push('Reduce hashtags and external links for better reach.');
    if (factors.Viral < 50) tips.push('Include quotable one-liners and a clear framework/steps.');
    if (factors.Specificity < 50) tips.push('Add dollar amounts, percentages, timeframes, or tool names.');
    if (factors.Structure < 50) tips.push('Break into shorter paragraphs. Avoid corporate buzzwords.');
    if (factors.Keywords < 40) tips.push('Include relevant industry terms (AI, SaaS, automation, etc.).');
    if (factors.CTA < 50) tips.push('End with a direct question or clear call to action.');
    return tips;
  }

  function scoreContent() {
    const text = document.getElementById('content').value.trim();
    if (!text) return;

    const factors = {
      Hook: scoreHook(text),
      Emotion: scoreEmotion(text),
      Platform: scorePlatform(text),
      Viral: scoreViral(text),
      Specificity: scoreSpecificity(text),
      Structure: scoreStructure(text),
      Keywords: scoreKeywords(text),
      CTA: scoreCTA(text)
    };

    const weights = { Hook: 0.2, Emotion: 0.15, Platform: 0.1, Viral: 0.15, Specificity: 0.1, Structure: 0.1, Keywords: 0.1, CTA: 0.1 };
    let total = 0;
    Object.keys(factors).forEach(k => { total += factors[k] * (weights[k] || 0.125); });
    const overall = Math.round(total);

    lastScore = { overall, factors };

    // Update ring
    const circumference = 175.93;
    const offset = circumference - (overall / 100) * circumference;
    const ring = document.getElementById('ringFg');
    ring.style.strokeDashoffset = offset;
    ring.style.stroke = getScoreColor(overall);
    document.getElementById('scoreValue').textContent = overall;
    document.getElementById('scoreValue').style.color = getScoreColor(overall);

    // Badge
    const badge = getBadge(overall);
    const badgeEl = document.getElementById('scoreBadge');
    badgeEl.textContent = badge.text;
    badgeEl.className = 'badge ' + badge.cls;

    // Factors grid
    const grid = document.getElementById('factorsGrid');
    grid.innerHTML = '';
    Object.entries(factors).forEach(([name, score]) => {
      const div = document.createElement('div');
      div.className = 'factor';
      div.innerHTML = `<span class="factor-name">${name}</span><span class="factor-score" style="color:${getScoreColor(score)}">${score}</span>`;
      grid.appendChild(div);
    });

    // Suggestions
    const tips = getSuggestions(factors);
    const sugEl = document.getElementById('suggestions');
    if (tips.length > 0 && overall < 80) {
      sugEl.innerHTML = '<strong>Suggestions:</strong><br>' + tips.join('<br>');
      sugEl.classList.add('visible');
    } else {
      sugEl.classList.remove('visible');
    }

    document.getElementById('results').classList.add('visible');

    // Emit to parent
    if (parentRef) {
      parentRef.emit('vpis-score', { overall, factors });
    }
    try {
      window.parent.postMessage({ type: 'vpis-score', overall, factors }, '*');
    } catch (e) {}
  }
</script>
</body>
</html>
