<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automation Status</title>
<script src="https://cdn.jsdelivr.net/npm/postmate@1.5.2/build/postmate.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #161b22;
    color: #e6edf3;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 16px;
    min-height: 100vh;
  }
  .card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
  }

  .status-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
  }
  .status-dot.active {
    background: #6EE05A;
    box-shadow: 0 0 8px rgba(110,224,90,0.5);
    animation: pulse 2s infinite;
  }
  .status-dot.idle {
    background: #484f58;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 4px rgba(110,224,90,0.3); }
    50% { box-shadow: 0 0 12px rgba(110,224,90,0.7); }
  }
  .status-text { font-size: 15px; font-weight: 600; }
  .status-text .label { color: #8b949e; font-weight: 400; font-size: 12px; display: block; }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    flex: 1;
    background: #161b22;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat-value {
    font-family: monospace;
    font-size: 20px;
    font-weight: 700;
    color: #6EE05A;
  }
  .stat-label {
    font-size: 11px;
    color: #8b949e;
    margin-top: 2px;
  }

  h3 {
    font-size: 13px;
    color: #8b949e;
    font-weight: 500;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .run-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #21262d;
  }
  .run-item:last-child { border-bottom: none; }
  .run-info { flex: 1; }
  .run-name { font-size: 14px; font-weight: 500; }
  .run-time { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .run-badge {
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .run-success { background: rgba(110,224,90,0.15); color: #6EE05A; }
  .run-fail { background: rgba(248,81,73,0.15); color: #f85149; }

  .empty {
    text-align: center;
    padding: 20px 0;
    color: #484f58;
    font-size: 13px;
  }

  .build-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    padding: 10px;
    background: rgba(110,224,90,0.08);
    border: 1px solid rgba(110,224,90,0.2);
    border-radius: 8px;
    color: #6EE05A;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .build-link:hover { background: rgba(110,224,90,0.15); }

  .refresh-note {
    text-align: center;
    font-size: 11px;
    color: #484f58;
    margin-top: 8px;
  }

  .footer {
    text-align: center;
    padding: 16px 0 4px;
    font-size: 11px;
    color: #8b949e;
  }
  .footer a { color: #6EE05A; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="status-header">
      <div class="status-dot idle" id="statusDot"></div>
      <div class="status-text">
        <span id="statusLabel">0n is idle</span>
        <span class="label" id="statusSub">Checking status...</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" id="totalExec">--</div>
        <div class="stat-label">Executions</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="successRate">--</div>
        <div class="stat-label">Success Rate</div>
      </div>
    </div>

    <h3>Recent Runs</h3>
    <div id="runsList">
      <div class="empty">Loading...</div>
    </div>

    <a class="build-link" href="https://0ncore.com/dashboard/automations" target="_blank">Build Automation</a>
    <div class="refresh-note">Auto-refreshes every 30s</div>
  </div>

  <div class="footer">Powered by <a href="https://0ncore.com" target="_blank">0n Core</a></div>

<script>
  let parentRef = null;
  let refreshInterval = null;

  const handshake = new Postmate.Model({
    getStatus: () => ({
      active: document.getElementById('statusDot').classList.contains('active'),
      totalExecutions: document.getElementById('totalExec').textContent
    })
  });

  handshake.then(parent => {
    parentRef = parent;
    parent.on('elementStore', (data) => {
      // Could receive config, refresh settings, etc.
    });
  });

  function timeAgo(dateStr) {
    if (!dateStr) return 'unknown';
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function fetchStatus() {
    const runsList = document.getElementById('runsList');
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    const sub = document.getElementById('statusSub');
    const totalEl = document.getElementById('totalExec');
    const rateEl = document.getElementById('successRate');

    try {
      const res = await fetch('https://0ncore.com/api/automations/recent?limit=3');

      if (!res.ok) throw new Error('API error');

      const data = await res.json();
      const runs = data.runs || data.data || data || [];
      const total = data.total_executions || data.total || 0;
      const rate = data.success_rate || null;
      const isActive = data.active || (Array.isArray(runs) && runs.length > 0 && runs.some(r => {
        const t = new Date(r.completed_at || r.created_at || 0).getTime();
        return Date.now() - t < 300000; // active if run within 5 min
      }));

      // Status indicator
      if (isActive) {
        dot.className = 'status-dot active';
        label.textContent = '0n is active';
      } else {
        dot.className = 'status-dot idle';
        label.textContent = '0n is idle';
      }
      sub.textContent = 'Last checked: ' + new Date().toLocaleTimeString();

      // Stats
      totalEl.textContent = typeof total === 'number' ? total.toLocaleString() : '--';
      rateEl.textContent = rate != null ? Math.round(rate) + '%' : '--';

      // Runs list
      if (!Array.isArray(runs) || runs.length === 0) {
        runsList.innerHTML = '<div class="empty">No recent automations</div>';
        return;
      }

      runsList.innerHTML = '';
      runs.forEach(run => {
        const success = run.status === 'success' || run.status === 'completed' || run.success === true;
        const div = document.createElement('div');
        div.className = 'run-item';
        div.innerHTML = `
          <div class="run-info">
            <div class="run-name">${escapeHtml(run.name || run.workflow_name || 'Unnamed Run')}</div>
            <div class="run-time">${timeAgo(run.completed_at || run.created_at)}</div>
          </div>
          <span class="run-badge ${success ? 'run-success' : 'run-fail'}">${success ? 'Success' : 'Failed'}</span>
        `;
        runsList.appendChild(div);
      });

      // Notify parent
      if (parentRef) {
        parentRef.emit('automation-status', { active: isActive, total, runs: runs.length });
      }
    } catch (e) {
      dot.className = 'status-dot idle';
      label.textContent = '0n is idle';
      sub.textContent = 'Unable to connect';
      runsList.innerHTML = '<div class="empty">Could not load automation data</div>';
    }
  }

  // Initial fetch + auto-refresh every 30s
  fetchStatus();
  refreshInterval = setInterval(fetchStatus, 30000);
</script>
</body>
</html>
