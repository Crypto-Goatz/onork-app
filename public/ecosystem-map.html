<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0n Ecosystem — Interactive Architecture Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a28;
    --card-hover: #222236;
    --border: #2a2a3e;
    --text: #e8e8f0;
    --text-dim: #a0a0b8;
    --text-muted: #606080;
    --accent: #7ed957;
    --accent-dim: #5cb83a;
    --cyan: #00d4ff;
    --purple: #a78bfa;
    --orange: #ff6b35;
    --red: #ef4444;
    --yellow: #eab308;
    --pink: #ec4899;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Top Bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-logo {
    font-size: 20px; font-weight: 800; color: var(--accent);
    letter-spacing: -0.5px;
  }
  .topbar-logo span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .topbar-stats { display: flex; gap: 20px; }
  .stat { text-align: center; }
  .stat-val { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

  .view-toggle { display: flex; gap: 4px; background: var(--surface); border-radius: 8px; padding: 3px; }
  .view-btn {
    padding: 6px 14px; border: none; background: none; color: var(--text-muted);
    font-family: inherit; font-size: 12px; cursor: pointer; border-radius: 6px;
    transition: all 0.2s;
  }
  .view-btn.active { background: var(--accent); color: #000; font-weight: 600; }
  .view-btn:hover:not(.active) { color: var(--text); }

  /* Canvas for graph view */
  #graph-canvas {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    cursor: grab;
  }
  #graph-canvas:active { cursor: grabbing; }
  #graph-canvas.hidden { display: none; }

  /* Grid/List views */
  .grid-view {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    overflow-y: auto; padding: 24px;
  }
  .grid-view.hidden { display: none; }

  .section-title {
    font-size: 13px; color: var(--accent); text-transform: uppercase;
    letter-spacing: 2px; margin: 24px 0 12px; font-weight: 700;
  }
  .section-title:first-child { margin-top: 0; }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(126,217,87,0.08);
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--cyan));
    opacity: 0; transition: opacity 0.25s;
  }
  .card:hover::before { opacity: 1; }
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .card-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
  }
  .card-title { font-size: 16px; font-weight: 700; }
  .card-version { font-size: 11px; color: var(--text-muted); }
  .card-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 3px 8px; border-radius: 4px; font-size: 10px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* Detail Panel */
  .detail-panel {
    position: fixed; top: 56px; right: -520px; bottom: 0; width: 520px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 90;
    transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
    padding: 24px;
  }
  .detail-panel.open { right: 0; }
  .detail-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); width: 32px; height: 32px; border-radius: 8px;
    cursor: pointer; font-size: 16px; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s;
  }
  .detail-close:hover { background: var(--red); border-color: var(--red); }
  .detail-title { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
  .detail-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .detail-section { margin-bottom: 20px; }
  .detail-section-title {
    font-size: 11px; color: var(--cyan); text-transform: uppercase;
    letter-spacing: 1.5px; font-weight: 700; margin-bottom: 8px;
    padding-bottom: 4px; border-bottom: 1px solid var(--border);
  }
  .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; }
  .detail-row-label { color: var(--text-muted); }
  .detail-row-value { color: var(--text); font-weight: 600; }
  .detail-list { list-style: none; }
  .detail-list li {
    padding: 6px 0; font-size: 12px; color: var(--text-dim);
    border-bottom: 1px solid rgba(42,42,62,0.5);
  }
  .detail-list li:last-child { border: none; }
  .detail-badge {
    display: inline-block; padding: 2px 6px; border-radius: 3px;
    font-size: 10px; font-weight: 700; margin-right: 4px;
  }

  /* Flow view */
  .flow-view {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    overflow: auto; padding: 40px;
  }
  .flow-view.hidden { display: none; }
  .flow-container {
    max-width: 1200px; margin: 0 auto;
  }
  .flow-layer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
  }
  .flow-layer-title {
    font-size: 14px; font-weight: 800; color: var(--accent);
    margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px;
  }
  .flow-items { display: flex; flex-wrap: wrap; gap: 12px; }
  .flow-item {
    padding: 10px 16px; border-radius: 8px; font-size: 12px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
    border: 1px solid transparent;
  }
  .flow-item:hover { transform: scale(1.05); }
  .flow-arrow {
    text-align: center; color: var(--text-muted); font-size: 24px;
    margin: 8px 0; line-height: 1;
  }

  /* Search */
  .search-box {
    position: fixed; top: 56px; left: 0; right: 0; z-index: 95;
    background: rgba(10,10,15,0.95); backdrop-filter: blur(20px);
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    display: none;
  }
  .search-box.visible { display: block; }
  .search-input {
    width: 100%; padding: 10px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 14px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }

  /* Tooltip */
  .tooltip {
    position: fixed; z-index: 200;
    background: var(--card); border: 1px solid var(--accent);
    border-radius: 8px; padding: 12px 16px;
    pointer-events: none; opacity: 0;
    transition: opacity 0.15s;
    max-width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .tooltip-desc { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Connection lines in flow */
  .conn-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 12px; font-size: 10px;
    background: rgba(126,217,87,0.1); color: var(--accent);
    border: 1px solid rgba(126,217,87,0.2);
  }
</style>

// =====================================================
// GRAPH VIEW — Interactive node graph
// =====================================================
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let panX = 0, panY = 0, zoom = 1;
let dragging = false, dragStartX, dragStartY;
let hoveredNode = null;
let nodes = [];
let edges = [];
let animFrame;

function initCanvas() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight - 56;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function buildGraph() {
  nodes = [];
  edges = [];

  const allItems = [
    ...ECOSYSTEM.core.map(n => ({ ...n, group: 'core' })),
    ...ECOSYSTEM.apps.map(n => ({ ...n, group: 'app' })),
    ...ECOSYSTEM.tools.map(n => ({ ...n, group: 'tool' })),
    ...ECOSYSTEM.infra.map(n => ({ ...n, group: 'infra' }))
  ];

  const cx = W / 2, cy = H / 2;

  // Position nodes in orbital rings
  const groups = { core: [], app: [], tool: [], infra: [] };
  allItems.forEach(item => groups[item.group].push(item));

  // Core ring (inner)
  groups.core.forEach((item, i) => {
    const angle = (i / groups.core.length) * Math.PI * 2 - Math.PI / 2;
    const r = 120;
    nodes.push({
      ...item, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r,
      radius: 38, vx: 0, vy: 0
    });
  });

  // App ring (middle)
  groups.app.forEach((item, i) => {
    const angle = (i / groups.app.length) * Math.PI * 2 - Math.PI / 3;
    const r = 300;
    nodes.push({
      ...item, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r,
      radius: 32, vx: 0, vy: 0
    });
  });

  // Tool ring (outer left)
  groups.tool.forEach((item, i) => {
    const angle = Math.PI + (i / (groups.tool.length + 1)) * Math.PI * 0.8 - 0.4;
    const r = 460;
    nodes.push({
      ...item, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r,
      radius: 26, vx: 0, vy: 0
    });
  });

  // Infra ring (outer right)
  groups.infra.forEach((item, i) => {
    const angle = (i / (groups.infra.length + 1)) * Math.PI * 0.9 - 0.3;
    const r = 460;
    nodes.push({
      ...item, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r,
      radius: 26, vx: 0, vy: 0
    });
  });

  // Build edges from connections
  allItems.forEach(item => {
    if (item.connections) {
      item.connections.forEach(targetId => {
        edges.push({ from: item.id, to: targetId });
      });
    }
  });
}

let time = 0;

function drawGraph() {
  time += 0.005;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  // Draw edges
  edges.forEach(edge => {
    const from = nodes.find(n => n.id === edge.from);
    const to = nodes.find(n => n.id === edge.to);
    if (!from || !to) return;

    const isHighlighted = hoveredNode && (hoveredNode.id === edge.from || hoveredNode.id === edge.to);

    ctx.beginPath();
    ctx.moveTo(from.x, from.y);

    // Curved edges
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const cx2 = mx - dy * 0.15;
    const cy2 = my + dx * 0.15;
    ctx.quadraticCurveTo(cx2, cy2, to.x, to.y);

    ctx.strokeStyle = isHighlighted
      ? `rgba(126,217,87,0.6)`
      : `rgba(126,217,87,0.08)`;
    ctx.lineWidth = isHighlighted ? 2 : 1;
    ctx.stroke();

    // Animated dot on highlighted edges
    if (isHighlighted) {
      const t = (time * 2) % 1;
      const px = (1-t)*(1-t)*from.x + 2*(1-t)*t*cx2 + t*t*to.x;
      const py = (1-t)*(1-t)*from.y + 2*(1-t)*t*cy2 + t*t*to.y;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7ed957';
      ctx.fill();
    }
  });

  // Draw nodes
  nodes.forEach(node => {
    const isHovered = hoveredNode && hoveredNode.id === node.id;
    const isConnected = hoveredNode && hoveredNode.connections && hoveredNode.connections.includes(node.id);
    const isSource = hoveredNode && node.connections && node.connections.includes(hoveredNode.id);

    // Glow
    if (isHovered || isConnected || isSource) {
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.radius + 12, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(node.x, node.y, node.radius, node.x, node.y, node.radius + 12);
      grad.addColorStop(0, (node.color || '#7ed957') + '40');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Node circle
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
    const dimmed = hoveredNode && !isHovered && !isConnected && !isSource;
    ctx.fillStyle = dimmed ? '#1a1a28' : '#12121a';
    ctx.fill();
    ctx.strokeStyle = dimmed ? '#2a2a3e' : (node.color || '#7ed957');
    ctx.lineWidth = isHovered ? 3 : 1.5;
    ctx.stroke();

    // Icon text
    ctx.fillStyle = dimmed ? '#606080' : (node.color || '#7ed957');
    ctx.font = `bold ${node.radius * 0.45}px 'SF Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(node.icon, node.x, node.y);

    // Label below
    ctx.fillStyle = dimmed ? '#404060' : '#e8e8f0';
    ctx.font = `600 ${Math.max(10, node.radius * 0.3)}px 'SF Mono', monospace`;
    ctx.fillText(node.name, node.x, node.y + node.radius + 14);

    // Version
    if (node.version) {
      ctx.fillStyle = dimmed ? '#303050' : '#606080';
      ctx.font = `400 9px 'SF Mono', monospace`;
      ctx.fillText(node.version, node.x, node.y + node.radius + 26);
    }
  });

  ctx.restore();
  animFrame = requestAnimationFrame(drawGraph);
}

function getNodeAt(mx, my) {
  const x = (mx - panX) / zoom;
  const y = (my - panY) / zoom;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = x - n.x, dy = y - n.y;
    if (dx * dx + dy * dy < (n.radius + 5) * (n.radius + 5)) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  dragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
});

canvas.addEventListener('mousemove', e => {
  const my = e.clientY - 56;
  if (dragging) {
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    return;
  }
  const node = getNodeAt(e.clientX, my);
  hoveredNode = node;
  canvas.style.cursor = node ? 'pointer' : 'grab';

  const tooltip = document.getElementById('tooltip');
  if (node) {
    tooltip.classList.add('visible');
    document.getElementById('tooltipTitle').textContent = node.name + (node.version ? ' ' + node.version : '');
    document.getElementById('tooltipDesc').textContent = node.desc ? node.desc.substring(0, 150) + '...' : '';
    tooltip.style.left = Math.min(e.clientX + 16, W - 300) + 'px';
    tooltip.style.top = Math.min(e.clientY + 16, H - 100) + 'px';
  } else {
    tooltip.classList.remove('visible');
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragging && Math.abs(e.clientX - dragStartX - panX) < 5 && Math.abs(e.clientY - dragStartY - panY) < 5) {
    const my = e.clientY - 56;
    const node = getNodeAt(e.clientX, my);
    if (node) openDetail(node);
  }
  dragging = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const oldZoom = zoom;
  zoom *= e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.3, Math.min(3, zoom));
  const mx = e.clientX, my = e.clientY - 56;
  panX = mx - (mx - panX) * (zoom / oldZoom);
  panY = my - (my - panY) * (zoom / oldZoom);
}, { passive: false });

function renderGrid(filter = '') {
  const gridView = document.getElementById('gridView');
  const lf = filter.toLowerCase();

  function matchesFilter(item) {
    if (!lf) return true;
    return (item.name + ' ' + item.desc + ' ' + (item.id || '')).toLowerCase().includes(lf);
  }

  function renderCards(items) {
    return items.filter(matchesFilter).map(item => `
      <div class="card" onclick="openDetailById('${item.id}')">
        <div class="card-header">
          <div class="card-icon" style="background:${item.color}20;color:${item.color}">${item.icon}</div>
          <div>
            <div class="card-title">${item.name}</div>
            <div class="card-version">${item.version || item.ref || item.type || ''}</div>
          </div>
        </div>
        <div class="card-desc">${(item.desc || '').substring(0, 120)}...</div>
        <div class="card-meta">
          ${item.domain ? `<span class="tag" style="background:#7ed95720;color:#7ed957">${item.domain}</span>` : ''}
          ${item.npm ? `<span class="tag" style="background:#00d4ff20;color:#00d4ff">npm: ${item.npm}</span>` : ''}
          ${item.stats && item.stats.tools ? `<span class="tag" style="background:#a78bfa20;color:#a78bfa">${item.stats.tools} tools</span>` : ''}
          ${item.stats && item.stats.pages ? `<span class="tag" style="background:#ff6b3520;color:#ff6b35">${item.stats.pages} pages</span>` : ''}
          ${item.stats && item.stats.apiRoutes ? `<span class="tag" style="background:#eab30820;color:#eab308">${item.stats.apiRoutes} API routes</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  const coreCards = renderCards(ECOSYSTEM.core);

// =====================================================
// DETAIL PANEL
// =====================================================
function findItem(id) {
  const all = [...ECOSYSTEM.core, ...ECOSYSTEM.apps, ...ECOSYSTEM.tools, ...ECOSYSTEM.infra];
  return all.find(n => n.id === id);
}

function openDetail(item) {
  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');

  let html = `
    <div class="detail-title">${item.name}</div>
    <div class="detail-subtitle">${item.version || item.ref || item.type || ''} ${item.domain ? '| ' + item.domain : ''} ${item.path ? '| ' + item.path : ''}</div>

    <div class="detail-section">
      <div class="detail-section-title">Description</div>
      <p style="font-size:12px;color:var(--text-dim);line-height:1.6;">${item.desc || ''}</p>
    </div>
  `;

  if (item.stats && Object.keys(item.stats).length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">Statistics</div>`;
    for (const [k, v] of Object.entries(item.stats)) {
      html += `<div class="detail-row"><span class="detail-row-label">${k}</span><span class="detail-row-value">${v}</span></div>`;
    }
    html += `</div>`;
  }

  if (item.modules && item.modules.length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">Modules</div><ul class="detail-list">`;
    item.modules.forEach(m => {
      html += `<li><strong style="color:var(--accent);">${m.name}</strong>${m.tools ? ` <span class="detail-badge" style="background:#7ed95720;color:#7ed957;">${m.tools} tools</span>` : ''}<br><span style="color:var(--text-muted);font-size:11px;">${m.desc}</span></li>`;
    });
    html += `</ul></div>`;
  }

  if (item.keyFiles && item.keyFiles.length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">Key Files</div><ul class="detail-list">`;
    item.keyFiles.forEach(f => {
      html += `<li style="font-size:11px;color:var(--cyan);">${f}</li>`;
    });
    html += `</ul></div>`;
  }

  if (item.tables && item.tables.length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">Tables</div><div style="display:flex;flex-wrap:wrap;gap:4px;">`;
    item.tables.forEach(t => {
      html += `<span class="tag" style="background:#3ecf8e15;color:#3ecf8e;border:1px solid #3ecf8e30;padding:4px 8px;">${t}</span>`;
    });
    html += `</div></div>`;
  }

  if (item.connections && item.connections.length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">Connected To</div><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    item.connections.forEach(c => {
      const target = findItem(c);
      html += `<span class="conn-badge" style="cursor:pointer;" onclick="openDetailById('${c}')">${target ? target.name : c}</span>`;
    });
    html += `</div></div>`;
  }

  if (item.deps && item.deps.length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">Dependencies</div><div style="display:flex;flex-wrap:wrap;gap:4px;">`;
    item.deps.forEach(d => {
      html += `<span class="tag" style="background:var(--card);color:var(--text-muted);border:1px solid var(--border);padding:3px 8px;">${d}</span>`;
    });
    html += `</div></div>`;
  }

  content.innerHTML = html;
  panel.classList.add('open');
}

function openDetailById(id) {
  const item = findItem(id);
  if (item) openDetail(item);
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
}

// =====================================================
// VIEW SWITCHING
// =====================================================
let currentView = 'graph';

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });

  canvas.classList.toggle('hidden', view !== 'graph');
  document.getElementById('gridView').classList.toggle('hidden', view !== 'grid');
  document.getElementById('flowView').classList.toggle('hidden', view !== 'flow');

  if (view === 'grid') renderGrid();
  if (view === 'flow') renderFlow();

  if (view === 'graph') {
    if (!animFrame) drawGraph();
  } else {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  }
}

// =====================================================
// SEARCH
// =====================================================
function toggleSearch() {
  const box = document.getElementById('searchBox');
  box.classList.toggle('visible');
  if (box.classList.contains('visible')) {
    document.getElementById('searchInput').focus();
  }
}

function handleSearch(val) {
  if (currentView === 'grid') {
    renderGrid(val);
  }
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    toggleSearch();
  }
  if (e.key === 'Escape') {
    closeDetail();
    document.getElementById('searchBox').classList.remove('visible');
  }
});

// =====================================================
// INIT
// =====================================================
window.addEventListener('resize', () => {
  initCanvas();
  buildGraph();
});

initCanvas();
buildGraph();
drawGraph();
</script>
</body>
</html>
