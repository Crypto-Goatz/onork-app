<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sh-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE05A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00B4FF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="sh-neon">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glass backdrop -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#sh-glow)" stroke="rgba(110,224,90,0.15)" stroke-width="1"/>
  <rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,0.04)"/>
  <!-- Code brackets < /> -->
  <path d="M24 24l-8 8 8 8" fill="none" stroke="#00B4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh-neon)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M40 24l8 8-8 8" fill="none" stroke="#00B4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh-neon)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  <!-- Shield check in center -->
  <path d="M29 32l2.5 3L35 31" fill="none" stroke="#6EE05A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Horizontal scan line -->
  <line x1="20" y1="32" x2="44" y2="32" stroke="#6EE05A" stroke-width="0.5" opacity="0.3">
    <animate attributeName="y1" values="20;44;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="20;44;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
