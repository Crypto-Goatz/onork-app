<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="de-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6EE05A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00B4FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="de-neon">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glass backdrop -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#de-glow)" stroke="rgba(110,224,90,0.15)" stroke-width="1"/>
  <rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,0.04)"/>
  <!-- Radar / scan circle -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#00B4FF" stroke-width="1" opacity="0.3"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#00B4FF" stroke-width="1" opacity="0.2"/>
  <circle cx="32" cy="32" r="4" fill="none" stroke="#6EE05A" stroke-width="1" opacity="0.4"/>
  <!-- Radar sweep -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="#6EE05A" stroke-width="1.5" stroke-linecap="round" filter="url(#de-neon)">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </line>
  <!-- Detection blips -->
  <circle cx="38" cy="26" r="1.5" fill="#ef4444">
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="1;2;1" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="25" cy="35" r="1.5" fill="#f59e0b">
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="r" values="1;2;1" dur="4s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <circle cx="36" cy="40" r="1.5" fill="#6EE05A">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="1;2;1" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <!-- Crosshair lines -->
  <line x1="32" y1="16" x2="32" y2="20" stroke="#00B4FF" stroke-width="0.5" opacity="0.4"/>
  <line x1="32" y1="44" x2="32" y2="48" stroke="#00B4FF" stroke-width="0.5" opacity="0.4"/>
  <line x1="16" y1="32" x2="20" y2="32" stroke="#00B4FF" stroke-width="0.5" opacity="0.4"/>
  <line x1="44" y1="32" x2="48" y2="32" stroke="#00B4FF" stroke-width="0.5" opacity="0.4"/>
</svg>
