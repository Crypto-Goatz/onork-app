<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ac-glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6EE05A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ac-neon">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glass backdrop -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#ac-glow)" stroke="rgba(0,180,255,0.2)" stroke-width="1"/>
  <rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,0.04)"/>
  <!-- Fingerprint-style concentric arcs -->
  <path d="M32 42c-5.5 0-10-4.5-10-10" fill="none" stroke="#00B4FF" stroke-width="1.5" stroke-linecap="round" filter="url(#ac-neon)">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M32 42c-3.5 0-6.5-3-6.5-6.5" fill="none" stroke="#6EE05A" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  <path d="M32 42c-1.5 0-3-1.5-3-3" fill="none" stroke="#00B4FF" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.6s"/>
  </path>
  <path d="M42 32c0 5.5-4.5 10-10 10" fill="none" stroke="#6EE05A" stroke-width="1.5" stroke-linecap="round" filter="url(#ac-neon)">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="0.9s"/>
  </path>
  <path d="M38.5 32c0 3.5-3 6.5-6.5 6.5" fill="none" stroke="#00B4FF" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.2s"/>
  </path>
  <!-- Center dot -->
  <circle cx="32" cy="28" r="3" fill="none" stroke="#6EE05A" stroke-width="1.5">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="28" r="1" fill="#6EE05A">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- User head -->
  <circle cx="32" cy="22" r="4" fill="none" stroke="#00B4FF" stroke-width="1.5" filter="url(#ac-neon)">
    <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
