name: Deploy to Vercel (zero build minutes)

# Build runs entirely on GitHub Actions runners. Vercel only hosts the
# pre-built artifacts (vercel deploy --prebuilt), so Vercel build minutes
# are NOT consumed.
#
# Auto-detects npm / pnpm / yarn from the repo's lockfile.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if   [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];      then echo "name=yarn" >> "$GITHUB_OUTPUT"
          else                              echo "name=npm"  >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm/yarn support)
        run: |
          corepack enable
          if [ "${{ steps.pm.outputs.name }}" = "pnpm" ]; then
            corepack prepare pnpm@10.15.0 --activate
            pnpm --version
          elif [ "${{ steps.pm.outputs.name }}" = "yarn" ]; then
            corepack prepare yarn@stable --activate
            yarn --version
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull Vercel project config + env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm install --no-frozen-lockfile ;;
            yarn) yarn install --network-timeout 600000 ;;
            # npm ci, not npm install: install reshapes the tree (1044 packages
            # vs the lockfile's 1055 here), so CI was building against a
            # dependency graph nobody had ever tested locally.
            npm)  npm ci --legacy-peer-deps --no-audit --no-fund ;;
          esac

      - name: Build with Vercel CLI
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # PREBUILT DEPLOY FAILS ON EVERY PUSH — 10 of 10 production deployments
      # measured 2026-08-30 are an ERROR followed a minute later by the READY
      # fallback. The job name above still says "zero build minutes"; it has
      # never once achieved that.
      #
      # THE ERROR STRING IN THE PREVIOUS VERSION OF THIS COMMENT WAS STALE, and
      # the comment told the next reader not to look. It named
      #   ENOENT lstat '/vercel/path0/node_modules/client-only/index.js'
      # Today's run (33317572708) dies on a different file in a different tree:
      #   ENOENT lstat '/vercel/path0/docs/0n-architecture-diagram-brief.md'
      # Same class, different first casualty. A "disproved theory" note pinned
      # to one error string becomes a stop sign over an error that has moved.
      #
      # MEASURED CAUSE (2026-08-30, from .vercel/output on this repo). Each
      # .vercel/output/functions/**/.vc-config.json carries a `filePathMap`
      # that maps a path in the function bundle back to a path in the SOURCE
      # tree, and Vercel lstats those during "Deploying outputs". 1,121 distinct
      # source paths in that manifest are excluded from the upload by
      # .vercelignore:
      #     2,289,719 refs  node_modules   (.vercelignore line 1)
      #        31,816 refs  rocket-extension
      #        14,744 refs  /docs
      # Sorted alphabetically the first of those is exactly
      # docs/0n-architecture-diagram-brief.md — today's error — and the old
      # error was a node_modules path from the same set. So the fault is not
      # symlinks: .vercelignore deletes files out from under the prebuilt
      # manifest, and the message just names whichever excluded file Vercel
      # reaches first. That is why flattening 1,552 symlinks changed nothing,
      # and why the error string moved when the docs page shipped.
      #
      # WHY IT IS NOT FIXED HERE: un-ignoring /docs only moves the failure to a
      # node_modules path (the previous symptom), and node_modules cannot be
      # un-ignored — shipping it is the whole point of prebuilt. The real fix is
      # to stop @vercel/next emitting source-tree filePathMap entries
      # (experimentalAllowBundling is False on every function here), and that
      # needs an experiment, not an edit. Do not re-derive the cause; run the
      # experiment. Re-derive the numbers above with:
      #   python3 - <<'EOF'   # over .vercel/output/functions/**/.vc-config.json
      #   ... filePathMap values not under .vercel/ or .next/, tested against
      #       .vercelignore
      #   EOF
      #
      # The fallback below deploys correctly every time; the cost is Vercel
      # build minutes on every single push. Left running rather than half-fixed.
      - name: Deploy pre-built artifacts to Vercel
        id: deploy
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          # Prebuilt saves Vercel build minutes, but a failure here must never
          # leave main undeployed — that state went unnoticed for three commits
          # on 31 Jul. If the prebuilt upload fails, ship it the slow way.
          if DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}); then
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Prebuilt deploy failed — falling back to a Vercel-side build."
            DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
            echo "mode=vercel-build" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $DEPLOY_URL"

      - name: Summary
        run: |
          # Tell the truth about build minutes. This line printed "zero" no matter
          # what, so a prebuilt failure that fell back to a billed Vercel build
          # looked identical to a clean prebuilt deploy — which is why the
          # fallback ran unnoticed on every push.
          if [ "${{ steps.deploy.outputs.mode }}" = "prebuilt" ]; then
            echo "### Deployed — prebuilt, zero Vercel build minutes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deployed — FELL BACK to a Vercel-side build (build minutes were used)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "URL: ${{ steps.deploy.outputs.url }}"             >> "$GITHUB_STEP_SUMMARY"
          echo "Build mode: \`${{ steps.deploy.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`"                    >> "$GITHUB_STEP_SUMMARY"
          echo "Package manager: \`${{ steps.pm.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
